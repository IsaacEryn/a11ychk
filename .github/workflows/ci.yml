name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build -w @a11ychk/extension
      # 웹 프로덕션 빌드 검증 — typecheck가 못 잡는 빌드 단계 오류(RSC 경계 등) 포착
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://www.a11ychk.com

      # 방금 빌드한 앱을 띄워 응답 자체를 확인한다. 유닛 테스트로는 상태 코드를 못 본다 —
      # 없는 주소가 404 화면을 보여 주면서 200을 반환하던 적이 있고(soft 404) 그때 아무도
      # 눈치채지 못했다. canonical·hreflang·구조화 데이터도 조용히 빠지는 축이라 같이 본다.
      - name: Route responses
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://www.a11ychk.com
        run: |
          npx next start -p 3210 &
          echo $! > /tmp/next.pid
          npm run test:routes
          kill "$(cat /tmp/next.pid)"

  # MCP 서버 스모크 — 브라우저 없이 도는 검사. 클라이언트 라이브러리 없이 stdio로
  # JSON-RPC를 직접 주고받고, stdout 전 줄을 JSON.parse로 강제해 로그 오염을 잡는다.
  # 표본 수집(crawl_sample)도 브라우저가 필요 없어 여기서 픽스처로 확인한다.
  mcp-smoke:
    name: mcp smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @a11ychk/mcp
      - name: Serve fixtures
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 --directory action/fixtures &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8899/clean.html > /dev/null && exit 0
            sleep 1
          done
          echo "픽스처 서버가 뜨지 않았다"; exit 1
      - run: node packages/mcp/scripts/smoke.mjs --crawl http://127.0.0.1:8899/

  # MCP 서버 통합 — chromium으로 실제 검사까지. 위반 픽스처에서 위반·가이드·권고
  # 분리를, 정상 픽스처에서 위반 0을 확인한다 (action self-test와 같은 픽스처).
  mcp-integration:
    name: mcp integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @a11ychk/mcp
      - run: npx playwright install --with-deps chromium
      - name: Serve fixtures
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 --directory action/fixtures &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8899/clean.html > /dev/null && exit 0
            sleep 1
          done
          echo "픽스처 서버가 뜨지 않았다"; exit 1
      - run: node packages/mcp/scripts/smoke.mjs --scan http://127.0.0.1:8899/violations.html
      - run: node packages/mcp/scripts/smoke.mjs --scan http://127.0.0.1:8899/clean.html

  # 배포한 GitHub Action을 우리가 먼저 써 본다. 남의 CI에서 처음 돌아가는 일이 없도록,
  # 로컬 픽스처 두 장으로 "위반을 찾는가"와 "게이트가 실제로 막는가"를 모두 확인한다.
  action:
    name: action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Serve fixtures
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 --directory action/fixtures &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8899/clean.html > /dev/null && exit 0
            sleep 1
          done
          echo "픽스처 서버가 뜨지 않았다"; exit 1

      - name: Scan the page with known violations
        id: violations
        uses: ./
        with:
          urls: http://127.0.0.1:8899/violations.html
          fail-on: none

      - name: Outputs must be populated
        env:
          RATE: ${{ steps.violations.outputs.compliance-rate }}
          NODES: ${{ steps.violations.outputs.violation-nodes }}
          RULES: ${{ steps.violations.outputs.violation-rules }}
        run: |
          test -n "$RATE" || { echo "compliance-rate가 비었다"; exit 1; }
          test "$NODES" -gt 0 || { echo "위반 요소를 하나도 찾지 못했다"; exit 1; }
          test "$RULES" -gt 0 || { echo "위반 규칙을 하나도 찾지 못했다"; exit 1; }

      - name: Gate must block serious violations
        id: gate
        continue-on-error: true
        uses: ./
        with:
          urls: http://127.0.0.1:8899/violations.html
          fail-on: serious

      - name: Confirm the gate failed
        env:
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          test "$OUTCOME" = failure || { echo "fail-on 게이트가 심각 위반을 통과시켰다"; exit 1; }

      - name: Clean page must pass the gate
        uses: ./
        with:
          urls: http://127.0.0.1:8899/clean.html
          fail-on: serious
