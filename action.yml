# A11y Check — GitHub Action
# PR·배포 파이프라인에서 지정 페이지의 자동 접근성 검사(WCAG 2.2 + KWCAG 2.2)를
# 실행한다. 결과는 스텝 요약(Markdown)으로 남고, fail-on 기준 초과 시 잡이 실패한다.
#
# 사용 예:
#   - uses: IsaacEryn/a11ychk@v1
#     with:
#       urls: |
#         https://example.com/
#         https://example.com/login
#       fail-on: serious
name: "A11y Check"
description: "Automated web accessibility scan (WCAG 2.2 AA + KWCAG 2.2) — axe-core plus custom rules, Korean-first reports"
author: "A11y Check (a11ychk.com)"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  urls:
    description: "검사할 페이지 URL 목록 (줄바꿈 또는 쉼표 구분, 최대 20개)"
    required: true
  fail-on:
    description: "잡을 실패시킬 위반 기준: any(모든 위반) | serious(심각 이상, 기본) | critical(치명적만) | none(보고만)"
    required: false
    default: "serious"

outputs:
  compliance-rate:
    description: "자동 검사 준수율 (%) — WCAG 성공기준 기준, 모범 사례 권고는 제외"
    value: ${{ steps.scan.outputs.compliance-rate }}
  violation-nodes:
    description: "위반 요소 수 (전체 페이지 합산, 권고 제외)"
    value: ${{ steps.scan.outputs.violation-nodes }}
  violation-rules:
    description: "위반 규칙 수 (권고 제외)"
    value: ${{ steps.scan.outputs.violation-rules }}
  advisory-rules:
    description: "모범 사례 권고 규칙 수 — 준수율·실패 판정에는 넣지 않는다"
    value: ${{ steps.scan.outputs.advisory-rules }}

# 모든 스텝은 action/ 안에서 돈다. 이 저장소는 모노레포지만 action/은 workspaces에
# 속하지 않는 독립 패키지라, 소비자 CI가 웹앱·확장 의존성까지 받는 일이 없다.
runs:
  using: "composite"
  steps:
    # undici 8이 Node 22.19+ 를 요구한다. 이 스텝은 잡 전체의 node 버전을 바꾸므로,
    # 호출부가 다른 버전을 쓰고 있다면 이 액션 뒤에 다시 setup-node를 걸어야 한다.
    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/action
      run: npm ci --ignore-scripts

    # 브라우저 캐시 키는 lockfile이 고정한 playwright 버전을 쓴다.
    # hashFiles()는 워크스페이스 기준이라 action_path 안의 파일을 못 읽는다.
    - name: Resolve playwright version
      id: pw
      shell: bash
      working-directory: ${{ github.action_path }}/action
      run: |
        echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

    - name: Cache chromium
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: a11ychk-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

    # 캐시가 맞으면 브라우저 바이너리(~170MB) 내려받기를 건너뛰고 시스템 라이브러리만 맞춘다.
    - name: Install chromium
      if: steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/action
      run: npx playwright install --with-deps chromium

    - name: Install chromium system deps
      if: steps.pw-cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/action
      run: npx playwright install-deps chromium

    - name: Scan
      id: scan
      shell: bash
      working-directory: ${{ github.action_path }}/action
      env:
        INPUT_URLS: ${{ inputs.urls }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        npx esbuild run.ts --bundle --platform=node --format=esm \
          --external:playwright --external:axe-core --external:undici \
          --outfile=.run.mjs --log-level=error
        node .run.mjs
